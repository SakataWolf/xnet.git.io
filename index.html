<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- IMPORTANTE para responsividade -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora Proporcional</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Orbitron', Arial, sans-serif;
    background: 
        radial-gradient(circle at bottom right, rgba(170, 0, 255, 0.25), transparent 40%),
        radial-gradient(circle at top left, rgba(90, 0, 160, 0.25), transparent 50%),
        #050008;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #e8d9ff;
}

/* Container principal */
.container {
    width: 100%;
    max-width: 420px;
    background: rgba(20, 5, 40, 0.75);
    backdrop-filter: blur(12px);
    border-radius: 18px;
    padding: 28px;
    box-shadow:
        0 0 30px rgba(160, 60, 255, 0.25),
        inset 0 0 20px rgba(160, 60, 255, 0.15);
    border: 1px solid rgba(180, 120, 255, 0.25);
}

/* Título */
h2 {
    text-align: center;
    margin-bottom: 24px;
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    color: #d7b6ff;
    text-shadow: 0 0 12px rgba(180, 90, 255, 0.6);
}

/* Labels */
label {
    font-size: 0.75rem;
    letter-spacing: 1px;
    margin-top: 14px;
    display: block;
    color: #c9a8ff;
}

/* Inputs e Select */
input, select {
    width: 100%;
    margin-top: 6px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: rgba(40, 10, 80, 0.9);
    color: #ffffff;
    font-size: 0.85rem;
    outline: none;
    box-shadow: inset 0 0 10px rgba(120, 60, 200, 0.4);
}

/* Botão */
button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #8b3cff, #c17bff);
    color: #ffffff;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow:
        0 0 18px rgba(160, 80, 255, 0.7),
        inset 0 0 10px rgba(255, 255, 255, 0.25);
}

/* Resultado */
.result {
    margin-top: 22px;
    padding: 14px;
    border-radius: 12px;
    background: rgba(30, 10, 60, 0.8);
    box-shadow: inset 0 0 15px rgba(150, 80, 255, 0.35);
    text-align: center;
    font-size: 0.85rem;
    white-space: pre-line;
    font-family: "Arial";
}

/* ======================
   TELAS MUITO PEQUENAS
   ====================== */
@media (max-width: 360px) {
    .container {
        padding: 22px;
        border-radius: 14px;
    }

    button {
        padding: 12px;
        font-size: 0.8rem;
    }

    input, select {
        padding: 10px;
        font-size: 0.8rem;
    }
}

/* ======================
   TELAS GRANDES
   ====================== */
@media (min-width: 1024px) {
    .container {
        max-width: 460px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h2>Calculadora Proporcional</h2>

    <label>Data de Instalação</label>
    <input type="date" id="startDate">

    <label>Data de Vencimento</label>
    <input type="date" id="endDate">

    <label>Plano</label>
    <select id="plan">
        <option value="99.90">30 dias - R$ 99,90</option>
        <option value="119.90">30 dias - R$ 119,90</option>
        <option value="139.90">30 dias - R$ 139,90</option>
    </select>

    <button onclick="calculate()">CALCULAR</button>
    <small style="display:block; margin-top:10px; text-align:center; opacity:0.7;">
Cálculo baseado em mês comercial (30 dias).
</small>


    <div id="result" class="result"></div>
</div>

<script>
function calculate() {
    const startInput = document.getElementById("startDate").value;
    const endInput = document.getElementById("endDate").value;
    const planValue = parseFloat(document.getElementById("plan").value);

    if (!startInput || !endInput) {
        document.getElementById("result").innerText = "Datas inválidas!";
        return;
    }

    const start = new Date(startInput);
    const end = new Date(endInput);

    if (end <= start) {
        document.getElementById("result").innerText = "A data final deve ser maior que a inicial!";
        return;
    }

    // ===== CÁLCULO COMERCIAL (30 DIAS FIXOS) =====
    let diaInicio = Math.min(start.getDate(), 30);
    let diaFim = Math.min(end.getDate(), 30);

    let mesInicio = start.getMonth() + 1;
    let mesFim = end.getMonth() + 1;

    let anoInicio = start.getFullYear();
    let anoFim = end.getFullYear();

    const diasComerciais =
        (anoFim - anoInicio) * 360 +
        (mesFim - mesInicio) * 30 +
        (diaFim - diaInicio);

    if (diasComerciais <= 0) {
        document.getElementById("result").innerText = "Período inválido para cálculo.";
        return;
    }

    const valorProporcional = ((planValue / 30) * diasComerciais).toFixed(2);

    document.getElementById("result").innerText =
        `Dias considerados (mês comercial): ${diasComerciais}\nValor proporcional: R$ ${valorProporcional}`;
}
</script>


</body>
</html>
